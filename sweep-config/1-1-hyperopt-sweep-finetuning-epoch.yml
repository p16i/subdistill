command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name 1-hyperopt-sweep-finetuning-epoch
parameters:
  dataset:
    value: cifar100-valsplit-people
  dataset-variant:
    values:
      - spurious-plussign--0.0
      - spurious-plussign--0.5
  lambda-layer:
    value: 1
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      - fitnet
      - attention-transfer
  output-dir:
    value: *group_name
  student:
    value: student-32-24-16-8
  teacher:
    value: cifar100-resnet18-v1
  parameter-partition-mode:
    values:
      - "@10"
      - "@50"
      - "@90"
  finetuning-with-layer-loss:
    values:
      - 1
      - 0