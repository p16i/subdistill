command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: sweep-output/2-main-experiment
  teacher:
    value: imagenet-vitb-tv
  student:
    values:
      - vitstudent-48
      - vitstudent-60
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    value: spurious-threespurious--1.0
  training-size:
    value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  lambda-task:
    value: 1.0
  lambda-kd:
    value: 0.0
  lambda-layer:
    value: 0.0
  layer-policy:
    value: nothing