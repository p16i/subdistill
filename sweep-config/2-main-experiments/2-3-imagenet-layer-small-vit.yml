command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: sweep-output/2-main-experiment
  teacher:
    value: imagenet-vitb-tv
  student:
    values:
      - vitstudent-48
      - vitstudent-60
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    value: ""
  training-size:
    value: 0.1
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - nothing
      - basis-identity:pca--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      - fitnet-noact
      - attention-transfer
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  default-lambda-layer-config:
    value: imagenet-small