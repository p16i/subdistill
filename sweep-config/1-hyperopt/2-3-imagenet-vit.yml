command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-valsplit-butterfly
  dataset-variant:
    value: spurious-threespurious--0.0
  training-size:
    values:
      - 1.0
      - 0.1
  lambda-layer:
    values:
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      - fitnet-noact
      - attention-transfer
  output-dir:
    value: sweep-output/1-hyper-opt
  student:
    value: vitstudent-48
  teacher:
    value: imagenet-vitb-tv
  epochs:
    value: 50