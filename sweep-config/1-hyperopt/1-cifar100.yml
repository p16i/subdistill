command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: cifar100-valsplit-people
  dataset-variant:
    value: spurious-plussign--0.0
  training-size:
    values:
      - 1.0
      - 0.1
  lambda-layer:
    values:
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - vid
      - fitnet-relu
      - attention-transfer
      # - basis-identity:pcalookahead--uncentered
  output-dir:
    value: sweep-output/1-hyper-opt
  student:
    value: student-32-24-16-8
  teacher:
    value: cifar100-resnet18-v1
  epochs:
    value: 100