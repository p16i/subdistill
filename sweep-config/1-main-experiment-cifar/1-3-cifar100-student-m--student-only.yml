command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: sweep-output/1-main-experiment
  dataset:
    value: cifar100-people-vs-others
  training-size:
    values:
      - 1.0
      - 0.1
      - 0.01
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  student:
    value: student-cifar-resnet18-32
  layers:
    value: layer3:layer3,layer4:layer4
  lambda-task:
    value: 1.0
  lambda-kd:
    value: 0.0
  weight-decay:
    values:
      - 0.0001
      - 0.001
      - 0.01
      - 0.1
      - 0.0
      - 1.0
  lambda-layer:
    value: 0.0
  layer-policy:
    value: nothing