command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: sweep-output/1-main-experiment
  dataset:
    values: 
      - cifar100-large_man_made_outdoor_things-vs-others
      - cifar100-aquatic_mammals-vs-others
  training-size:
    values:
      - 0.8
      - 0.1
      - 0.01
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  student:
    value: student-cifar-resnet18-32
  layers:
    value: layer1:layer1,layer2:layer2,layer3:layer3,layer4:layer4
  weight-decay:
    values:
      - 0.0
      - 0.000001
      - 0.00001
      - 0.0001
      - 0.001
      - 0.01
  distillation-policy:
    values: 
      - student-only
      - kd-only