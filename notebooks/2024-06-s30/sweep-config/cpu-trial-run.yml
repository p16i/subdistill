command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp
  teacher:
    values: 
      - imagenet-resnet18-tv
      - imagenet-resnet50-tv
      - imagenet-vgg16-tv
      - imagenet-nfnetf0-dm
  student:
    values:
      - student-32-24-16-8
      - student-48-40-32-24
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    value: spurious-watermarkjpeg--1.0
  training-size:
    value: 1.0
  seed:
    value: 1
  layer-policy:
    value: basis-identity:pcalookahead--uncentered
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  default-lambda-layer-config:
    value: imagenet-spurious