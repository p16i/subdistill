command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  layers:
    value: layer3:layer3,layer4:layer4
  student:
    values: 
      - student-cifar-resnet18-16
      - student-cifar-resnet18-32
      - student-cifar-resnet18-64
  dataset:
    value: cifar100-people-vs-others
  layer-policy:
     value: basis-bn:prcaposdef
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  lambda-layer:
      value:  10.0
  training-size:
    values:
      - 1.0
      - 0.5
      - 0.1
      - 0.01