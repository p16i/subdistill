command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  layers:
    value: layer3:layer3,layer4:layer4
  student:
    value: student-cifar-resnet18-32
  dataset:
    value: cifar100-people-vs-others
  layer-policy:
     values: 
        # - basis-bn:prcaposdef
        # - attention-transfer
        # - vid
        # - vkd
        - spkd
        - basis-bn:prcaposdef-with-weight-p1
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  lambda-layer:
      values:  
        - 0.001
        - 0.01
        - 0.1
        - 1
        - 10
        - 100
        - 1000
  training-size:
    values:
      - 1.0
      - 0.5
      - 0.1
      - 0.01