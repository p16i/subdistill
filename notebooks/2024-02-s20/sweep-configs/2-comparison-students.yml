command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --use-val-split
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-02-s19/experiments/2-comparison-students
parameters:
  contamination-level:
    value: 0.0
  dataset:
    values:
      - cifar100-aquatic_mammals
      - cifar100-fish
      - cifar100-flowers
      - cifar100-food_containers
      - cifar100-fruit_and_vegetables
      - cifar100-household_electrical_devices
      - cifar100-household_furniture
      - cifar100-insects
      - cifar100-large_carnivores
      - cifar100-large_man_made_outdoor_things
      - cifar100-large_natural_outdoor_scenes
      - cifar100-large_omnivores_and_herbivores
      - cifar100-medium_mammals
      - cifar100-non_insect_invertebrates
      - cifar100-people
      - cifar100-reptiles
      - cifar100-small_mammals
      - cifar100-trees
      - cifar100-vehicles_1
      - cifar100-vehicles_2
  lambda-task:
    value: 0
  lambda-kd:
    value: 1
  lambda-layer:
    values:
      - 0
      - 0.001
      - 0.01
      - 0.1
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
      - 1000000
  training-size:
    value: 1.0
  seed:
    value: 1.0
  layers:
    value: layer1,layer2,layer3,layer4
  layer-policies:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - vid
      - random
  output-dir:
    value: *group_name
  student:
    values:
      - resnet18dims16-8-8-5
      - resnet18dims24-16-16-5
      - resnet18dims32-24-24-5
  teacher:
    value: cifar100-resnet18-v1
program: scripts/distill-layerwise.py
project: xaikd-distillation-layerwise-s19
