method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-02-s19/experiments/4-cifar100-data-scarcity.yml
parameters:
  contamination-level:
    values:
      - 0.0
      - 0.25
      - 0.5
      - 0.75
      - 1.0
  dataset:
    value: cifar100-people
  lambda-kd:
    value: 1
  lambda-task:
    value: 0
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policies:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - basis-identity:random--uncentered
      - vid
      - nothing
      # - attention-transfer
      # - fitnet
  output-dir:
    value: *group_name
  student:
    values:
      - resnet18dims16-8-8-5
      - resnet18dims24-16-16-5
      - resnet18dims32-24-24-5
  teacher:
    value: cifar100-resnet18-v1
  training-size:
    values:
      - 0.125
      - 0.25
      - 0.5
      - 1
program: scripts/distill-layerwise.py
project: xaikd-distillation-layerwise-s19
