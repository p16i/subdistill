command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    values: 
      - ""
      - spurious-threespurious--1.0
  training-size:
    value: 1.0
  lambda-layer:
    value: 10
  seed:
    values:
      - 1
  layers:
    value: encoder.layers.9:encoder.layers.4,encoder.layers.11:encoder.layers.5
  layer-policy:
    values: 
      - vid
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
  last-layer-policy:
    value: kd
  output-dir:
    value: /tmp/mobilenets
  student:
    values: 
      - vitstudent6l-48
      - vitstudent6l-60
      - vitstudent6l-72
      - vitstudent6l-132
  teacher:
    values: 
      - imagenet-vitb-tv
  epochs:
    value: 50