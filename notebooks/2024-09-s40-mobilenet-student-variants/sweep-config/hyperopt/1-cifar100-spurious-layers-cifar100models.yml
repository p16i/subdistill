command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: cifar100-valsplit-people
  dataset-variant:
    value: spurious-plussign--1.0
  training-size:
    value: 1.0
  lambda-layer:
    values:
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - vid
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
  layers: 
    value: layer3:features.3,layer4:features.8
  output-dir:
    value: /tmp/hyper-opt
  student:
    value: student-mobilenetxs-cifar
  teacher:
    value: cifar100-resnet18-v1
  epochs:
    value: 100