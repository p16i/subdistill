command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-valsplit-butterfly
  dataset-variant:
    value: spurious-threespurious--1.0
  training-size:
    value: 1.0
  lambda-layer:
    values:
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - vid
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
  output-dir:
    value: /tmp
  student:
    value: student-mobilenets
  teacher:
    values: 
      - imagenet-mobilenetl-tv
  epochs:
    value: 50