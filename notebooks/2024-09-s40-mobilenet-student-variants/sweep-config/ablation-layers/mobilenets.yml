command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp
  teacher:
    value: imagenet-mobilenetl-tv
  student:
    value: student-mobilenets
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    value: spurious-threespurious--1.0
  training-size:
    value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  layers:
    values:
      - features.12:features.8,features.16:features.12
      # - features.6:features.3,features.12:features.8,features.16:features.12
      # - features.3:features.1,features.6:features.3,features.12:features.8,features.16:features.12
  layer-policy:
    values:
      # - basis-rotation:prca-sortabs--uncentered
      - basis-identity:prca-sortabs--uncentered
      # - basis-rotation:pca--uncentered
      # - vid
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  default-lambda-layer-config:
    value: imagenet-spurious