command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: cifar100-people
  dataset-variant:
    value: ""
  training-size:
    value: 1.0
  lambda-layer:
    value: 1
  seed:
    values:
      - 1
  layers: 
    value: layer3:features.1,layer4:features.3
  layer-policy:
    values: 
      - vid
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
  last-layer-policy:
    value: kd
  output-dir:
    value: /tmp/mobilenets
  student:
    values: 
      - student-mobilenetxs
      - student-mobilenetxxs
  teacher:
    values: 
      - cifar100-resnet18-v1
  epochs:
    value: 100