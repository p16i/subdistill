command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp
  teacher:
    value: imagenet-vitb-tv
  student:
    values:
      - vitstudent-48
      - vitstudent-60
      - vitstudent-72
      - vitstudent-132
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    values:
      - spurious-threespurious--1.0
      # - spurious-threespurious--0.75
      # - spurious-threespurious--0.5
  training-size:
    value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - nothing
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
      - vid
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  default-lambda-layer-config:
    value: imagenet-spurious