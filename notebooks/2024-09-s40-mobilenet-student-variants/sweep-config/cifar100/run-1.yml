command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    values: 
      - cifar100-aquatic_mammals
      - cifar100-fish
      - cifar100-flowers
      - cifar100-food_containers
      - cifar100-fruit_and_vegetables
      - cifar100-household_electrical_devices
      - cifar100-household_furniture
      - cifar100-insects
      - cifar100-large_carnivores
      - cifar100-large_man_made_outdoor_things
      - cifar100-large_natural_outdoor_scenes
      - cifar100-large_omnivores_and_herbivores
      - cifar100-medium_mammals
      - cifar100-non_insect_invertebrates
      - cifar100-people
      - cifar100-reptiles
      - cifar100-small_mammals
      - cifar100-trees
      - cifar100-vehicles_1
      - cifar100-vehicles_2
  dataset-variant:
    value: spurious-plussign--1.0
  training-size:
    value: 1.0
  seed:
    values:
      - 1
  layer-policy:
    values: 
      - vid
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
  layers: 
    value: layer3:features.3,layer4:features.8
  last-layer-policy:
    value: kd
  output-dir:
    value: /tmp/mobilenets
  student:
    values: 
      - student-mobilenetxs-cifar
      - student-mobilenetxxs-cifar
  teacher:
    values: 
      - cifar100-resnet18-v1
  epochs:
    value: 100
  default-lambda-layer-config:
    value: cifar100-spurious