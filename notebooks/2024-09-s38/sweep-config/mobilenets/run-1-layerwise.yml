command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    values: 
      - ""
      - spurious-threespurious--1.0
  training-size:
    value: 1.0
  lambda-layer:
    value: 10
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values: 
      # - attention-transfer
      - vid
      - basis-rotation:pca--uncentered
      - basis-rotation:prca-sortabs--uncentered
      # - spkd
      # - vkd
      # - basis-identity:pca--uncentered
      # - basis-identity:prca-sortabs--uncentered
      # - vkd-modified
  last-layer-policy:
    value: kd
  layers:
    value: features.12:features.8,features.16:features.12
  output-dir:
    value: /tmp/mobilenets
  student:
    values: 
      # - student-mobilenets
      # - student-mobilenetxs
      - student-mobilenetxxs
      # - student-mobilenets-trained
  teacher:
    value: imagenet-mobilenetl-tv
  epochs:
    value: 100