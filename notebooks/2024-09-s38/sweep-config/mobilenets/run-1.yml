command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    values: 
      - ""
      - spurious-threespurious--1.0
  training-size:
    value: 1.0
  lambda-layer:
    value: 0
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    value: nothing
  last-layer-policy:
    value: kd
  layers:
    value: features.10:features.8
  output-dir:
    value: /tmp/mobilenets
  student:
    values: 
      - student-mobilenets
      - student-mobilenets-trained
  teacher:
    value: imagenet-mobilenetl-tv
  epochs:
    value: 100