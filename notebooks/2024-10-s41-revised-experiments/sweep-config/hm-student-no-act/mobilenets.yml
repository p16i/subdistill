command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp
  teacher:
    values: 
      - imagenet-mobilenetl-tv
  student:
    values:
      # - student-mobilenets
      # - student-mobilenets-wo-last-act
      - student-mobilenets-lastd25v2
      # - student-mobilenetxs
      # - student-mobilenetxs-wo-last-act
  dataset:
    value: imagenet-butterfly
  layers:
    value: features.12:features.8,features.16:features.12
  dataset-variant:
    values:
      - spurious-threespurious--1.0
      - spurious-threespurious--0.5
  training-size:
    value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - basis-identity:prca-sortabs--uncentered
      - basis-rotation:prca-sortabs--uncentered
      - basis-identity:pca--uncentered
      - basis-rotation:pca--uncentered
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  lambda-layer:
      value: 10