command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp
  teacher:
    values: 
      - imagenet-resnet18-tv
  student:
    values:
      - student-32-24-16-8
      # - student-48-40-32-24
      # - student-56-48-40-32
      - student-112-96-80-64
  dataset:
    value: imagenet-butterfly
  layers:
    value: layer3:layer3,layer4:layer4
  dataset-variant:
    values:
      - spurious-threespurious--1.0
  training-size:
    value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      # - nothing
      # - basis-identity:pca--uncentered
      # - basis-identity-attn:pca--uncentered
      - basis-identity-attnp1:prca-sortabs-corrected-sign--uncentered
      - basis-identity-attnp2:prca-sortabs-corrected-sign--uncentered
      - basis-identity-attnp4:prca-sortabs-corrected-sign--uncentered
      - basis-identity:prca-sortabs-corrected-sign--uncentered
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  lambda-layer:
      value: 10