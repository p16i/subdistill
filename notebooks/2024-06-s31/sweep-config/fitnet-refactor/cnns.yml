command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp
  teacher:
    values: 
      - imagenet-resnet18-tv
      - imagenet-nfnetf0-dm
  student:
    value: student-32-24-16-8
  dataset:
    value: imagenet-butterfly
  training-size:
    value: 0.1
  seed:
    value: 1.0
  layer-policy:
    values: 
       - fitnet-noact
       - fitnet-relu
  lambda-task:
    value: 0.0
  lambda-kd:
    value: 1.0
  lambda-layer:
    value: 10.0