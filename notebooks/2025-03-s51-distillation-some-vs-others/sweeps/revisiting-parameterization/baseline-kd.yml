command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  student:
    value: student-mobilenetxs
  dataset:
    value: cifar100val-people-vs-others
  layer-policy:
     values: 
      - basis-identity:prcaposdef
      - basis-bn:prcaposdef
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  lambda-layer:
      values: 
        - 0.001
        - 0.01
        - 0.1
        - 1.0
        - 10.0
        - 100.0
  training-size:
    value: 0.125