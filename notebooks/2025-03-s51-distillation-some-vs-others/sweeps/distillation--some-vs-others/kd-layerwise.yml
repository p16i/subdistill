command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  teacher:
    value: cifar100-resnet18-v1
  student:
    value: student-mobilenetxs
  dataset:
    value: cifar100-people-vs-others
  layer-policy:
     values: 
      # - fitnet-relu
      # - vid
      - basis-bn:prcaposdef
      - basis-bn-only-runstats:prcaposdef
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  lambda-layer:
      value: 10
  training-size:
    values:
      - 1.0
      - 0.5
      - 0.25
      - 0.125
  seed:
    values:
      - 1
      - 2
      - 3