command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  teacher:
    value: cifar100-resnet18-v1
  student:
    value: student-lenet
  layers: 
    value: layer3:pool1,layer4:pool2
  dataset:
    value: cifar100-people-vs-others
  layer-policy:
     values: 
      - nothing
      # - vid
      # - basis-bn:prcaposdef
      # - basis-bn:pca
      # - basis-bn:gradpca
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  default-lambda-layer-config:
      value: cifar100-some-vs-others--small
  training-size:
    values:
      - 1.0
      - 0.5
      - 0.25
      - 0.125
      - 0.0625
      - 0.03125
  seed:
    values:
      - 1
      - 2
      - 3