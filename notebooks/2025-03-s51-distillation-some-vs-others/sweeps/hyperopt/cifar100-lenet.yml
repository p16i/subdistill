command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  layers:
    value: layer3:pool1,layer4:pool2
  student:
    value: student-lenet
  dataset:
    value: cifar100-valsplit-people-vs-others
  layer-policy:
     values: 
      - vid
      - attention-transfer
      - spkd
      - vkd
      - basis-bn:prcaposdef
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  lambda-layer:
      values: 
        - 0.001
        - 0.01
        - 0.1
        - 1.0
        - 10.0
        - 100.0
        - 1000.0
  training-size:
      value: 0.001