command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
parameters:
  output-dir:
    value: /tmp
  seed:
    value: 1
  teacher:
    value: cifar100-resnet18-v1
  layers:
    value: layer3:layer3,layer4:layer4
  student:
    value: student-cifar-resnet18-32
  dataset:
    value: cifar100-people-vs-others
  epochs:
    value: 5
  layer-policy:
     values: 
      - nothing
      - vid
      - attention-transfer
      - vkd
      - spkd
      - basis-bn:prcaposdef
      - basis-rotation:prcaposdef
      - basis-rotation-with-scale:prcaposdef
      - basis-with-bias:prcaposdef
  lambda-task:
      value:  0.0
  lambda-kd:
      value:  1.0
  lambda-layer:
      value:  10.0
  training-size:
    value: 0.01