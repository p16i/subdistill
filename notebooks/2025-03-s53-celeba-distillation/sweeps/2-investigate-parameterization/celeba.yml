command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
name: 2-investigate-parameterization/cifar100
parameters:
  dataset:
    value: celeba-attr31
  lambda-kd:
    value: 1
  lambda-layer:
    values:
      - 0.001
      - 0.01
      - 0.1
      - 1
      - 10
      - 100
      - 1000
  lambda-task:
    value: 0
  layer-policy:
    values:
      # - basis-bn:prcaposdef
      # - basis-bn:pca
      - basis-bn:prcaposdef-with-weight-p1
      # - basis-rotation-with-scale:prcaposdef
  layers:
    value: layer3:layer3,layer4:layer4
  output-dir:
    value: /tmp
  seed:
    values:
      - 1
      - 2
      - 3
  student:
    value: student-resnet18-32
  teacher:
    value: celeba-resnet18-pretrained
  training-size:
    value: 0.01