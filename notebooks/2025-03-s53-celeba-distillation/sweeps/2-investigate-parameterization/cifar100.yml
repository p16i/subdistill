command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_auroc
name: 2-investigate-parameterization/cifar100
parameters:
  dataset:
    value: cifar100-people-vs-others
  lambda-kd:
    value: 1
  lambda-layer:
    values:
      - 0.001
      - 0.01
      - 0.1
      - 1
      - 10
      - 100
      - 1000
  lambda-task:
    value: 0
  layer-policy:
    values:
      # - basis-bn:prcaposdef
      # - basis-bn-only-affine:prcaposdef
      # - basis-with-bias:prcaposdef
      # - basis-rotation:prcaposdef
      # - basis-rotation-with-scale:prcaposdef
      # - basis-with-biasv2:prcaposdef
      - basis-bn:prcaposdef--centered
  layers:
    value: layer3:layer3,layer4:layer4
  output-dir:
    value: /tmp
  seed:
    values:
      - 1
      - 2
      - 3
  student:
    value: student-cifar-resnet18-32
  teacher:
    value: cifar100-resnet18-v1
  training-size:
    values:
      # - 1
      - 0.01