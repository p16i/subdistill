command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-butterfly
  dataset-variant:
    values: 
      - ""
      - spurious-threespurious--1.0
  training-size:
    value: 1.0
  lambda-layer:
    value: 10
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      # - basis-identity:prca-sortabs--uncentered
      - basis-identity:pca--uncentered
      # - spkd
  last-layer-policy:
    values:
      - kd
      # - dkd
  output-dir:
    value: /tmp/trial-runs/vitprca-dkd-spkd
  student:
    value: vitstudent-48
  teacher:
    value: imagenet-vitb-tv
  epochs:
    value: 50