command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  dataset:
    value: imagenet-valsplit-cat
  dataset-variant:
    value: spurious-copyrightwatermarkjpeg--0.0
  training-size:
    value: 0.1
  lambda-layer:
    values:
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policy:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      - fitnet-relu
      - attention-transfer
  output-dir:
    value: /tmp/hyper-opt
  student:
    value: student-32-24-16-8
  teacher:
    value: imagenet-resnet18-tv
  epochs:
    value: 50