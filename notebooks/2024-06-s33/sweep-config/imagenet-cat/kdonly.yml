command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp/run
  teacher:
    value: imagenet-resnet18-tv
  student:
    values: 
      - student-32-24-16-8
      - student-48-40-32-24
  dataset:
    value: imagenet-cat
  dataset-variant:
    value: spurious-copyrightwatermarkjpeg--1.0
  training-size:
    value: 1.0
  layer-policy:
    value: nothing
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  lambda-layer:
      value: 0.0
  seed:
    values:
      - 1
      - 2
      - 3 