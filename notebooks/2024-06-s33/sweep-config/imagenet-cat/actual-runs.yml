command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp/imagenet-cat-actual-run
  teacher:
    value: imagenet-resnet18-tv
  student:
    values: 
      - student-32-24-16-8
      # - student-48-40-32-24
  dataset:
    value: imagenet-cat
  dataset-variant:
    value: spurious-copyrightwatermarkjpeg--1.0
  training-size:
    value: 1.0
  layer-policy:
    values:
      - nothing
      - basis-identity:pca--uncentered
      - attention-transfer
      - basis-identity:prca-sortabs--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      - fitnet-relu
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3 
  default-lambda-layer-config:
    value: imagenet-cat-small