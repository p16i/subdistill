command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp/threespurious
  teacher:
    value: imagenet-resnet18-tv
  student:
    value: student-32-24-16-8
  dataset:
    values: 
      # - imagenet-cat
      # - imagenet-butterfly
      - imagenet-car
      - imagenet-truck
  dataset-variant:
    value: spurious-threespurious--1.0
  training-size:
    value: 1.0
  layer-policy:
    values:
      - nothing
      - basis-identity:pca--uncentered
      - attention-transfer
      - basis-identity:prca-sortabs--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      # - fitnet-relu
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3 
  default-lambda-layer-config:
    value: imagenet-cat-small