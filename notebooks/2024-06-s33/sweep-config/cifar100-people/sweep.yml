command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp/cifar100
  teacher:
    value: cifar100-resnet18-v1
  student:
    values:
      - student-32-24-16-8
      - student-48-40-32-24
  dataset:
    values: 
      # - cifar100-people
      - cifar100-vehicles_2
  dataset-variant:
    value: spurious-plussign--1.0
  training-size:
    value: 1.0 
  layer-policy:
    values:
      - nothing
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - basis-identity:pcalookahead--uncentered
      - vid
      - fitnet-relu
      - attention-transfer
  lambda-task:
      value: 0.0
  lambda-kd:
      value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  default-lambda-layer-config:
    value: cifar100-small