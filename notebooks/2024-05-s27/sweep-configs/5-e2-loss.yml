command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-05-s27/experiments/5-e2-loss-v3
parameters:
  contamination-level:
    value: 0.0
  dataset:
    values:
      # - imagenet-butterfly
      - imagenet-butterfly-spurious0.5
  lambda-task:
    value: 0
  lambda-kd:
    value: 1
  lambda-layer:
    value: 0
  lambda-e2:
    values:
      - 0
      - 1
      - 5
      - 10
  training-size:
    value: 0.125
  seed:
    values:
      - 1
      - 2
      - 3
  layers:
    value: ""
  layer-policies:
    value: nothing
  output-dir:
    value: *group_name
  student:
    values:
      - vggcustomimagenetdims-128-96-96-40
      - vggcustomimagenetdims-64-48-48-20
      - vggcustomimagenetdims-32-24-24-10
  teacher:
    value: imagenet-resnet34-tv
  parameter-partition-mode:
    value: "@0"

program: scripts/distill-layerwise.py