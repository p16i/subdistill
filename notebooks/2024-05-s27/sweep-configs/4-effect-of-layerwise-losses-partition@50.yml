command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-05-s27/experiments/4-effect-of-layerwise-losses-partition@50
parameters:
  contamination-level:
    value: 0.0
  dataset:
    values:
      # - imagenet-butterfly
      - imagenet-butterfly-spurious0.5
  lambda-task:
    value: 0
  lambda-kd:
    value: 1
  lambda-layer:
    value: 1
  training-size:
    value: 0.125
  seed:
    values:
      - 1
      - 2
      - 3
  layers:
    values:
      - features.9:layer1,features.16:layer2,features.23:layer3,features.30:layer4
      - features.16:layer2,features.23:layer3,features.30:layer4
      - features.23:layer3,features.30:layer4
      - features.30:layer4
  layer-policies:
    values:
      - basis-identity:pca--uncentered
      - vid
  output-dir:
    value: *group_name
  student:
    value: vggcustomimagenetdims-32-24-24-10
  teacher:
    value: imagenet-vgg16-tv
  parameter-partition-mode:
    value: "@50"

program: scripts/distill-layerwise.py
