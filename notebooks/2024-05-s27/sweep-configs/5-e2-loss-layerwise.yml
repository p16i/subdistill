command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-05-s27/experiments/5-e2-loss
parameters:
  contamination-level:
    value: 0.0
  dataset:
    values:
      - imagenet-butterfly
      - imagenet-butterfly-spurious0.5
  lambda-task:
    value: 0
  lambda-kd:
    value: 1
  lambda-layer:
    value: 1
  lambda-e2:
    value: 0
      - 0
  training-size:
    value: 0.125
  seed:
    values:
      - 1
      - 2
      - 3
  layers:
    values: 
      - layer4:layer4
  layer-policies:
    values:
      - vid
  output-dir:
    value: *group_name
  student:
    value: resnet18
  teacher:
    value: imagenet-resnet34-tv
  parameter-partition-mode:
    value: "@50"

program: scripts/distill-layerwise.py