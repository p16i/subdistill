command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --enable-checkpointing
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-05-s27/experiments/6-ignore-layer-loss-fullupdate
parameters:
  contamination-level:
    value: 0.0
  dataset:
    values:
       - imagenet-butterfly
       - imagenet-butterfly-spurious0.5
  lambda-task:
    value: 0
  lambda-kd:
    value: 1
  lambda-layer:
    value: 1
  training-size:
    value: 0.125
  seed:
    values:
      - 1
      - 2
      - 3
  layers:
    value: layer3:layer3,layer4:layer4
  layer-policies:
    values:
      - fitnet
      - attention-transfer
      - vid
  output-dir:
    value: *group_name
  student:
    value: resnet18
  teacher:
    value: imagenet-resnet34-tv
  parameter-partition-mode:
    values:
      - "@90"
      - "@50"
      - "@10"
  ignore-layer-loss-fullupdate:
    values:
      - 0
      - 1


program: scripts/distill-layerwise.py
