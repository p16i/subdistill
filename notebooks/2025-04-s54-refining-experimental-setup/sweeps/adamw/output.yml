command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp/adamw
  dataset:
    value: cifar100-people-vs-others
  training-size:
    value: 0.01
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  student:
    value: student-cifar-resnet18-32
  layers:
    value: layer3:layer3,layer4:layer4
  weight-decay:
    values:
      - 0.0
      - 0.000001
      - 0.00001
      - 0.0001
      - 0.001
      - 0.01
  distillation-policy:
    values: 
      - student-only
      - kd-only