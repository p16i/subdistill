command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: /tmp/pca-prca
  dataset:
    value: celeba-attr25
  epochs:
    value: 50
  training-size:
    value: 0.01
  seed:
    values: 
      - 1
      - 2
      - 3
  teacher:
    value: celeba-resnet18-finetunedv1
  student:
    values: 
      - student-resnet18-16
      # - student-resnet18-32
  layers:
    value: layer1,layer2,layer3,layer4
  weight-decay:
    value: 0
  distillation-policy:
    values:
      - basis-bn-sum-normalized:prcaposdef-entropy0.95
      - basis-bn-sum-normalized:pca
  lambda-layer:
    values: 
      - 0.01
      # - 0.1
      # - 1.0
      # - 0.001
      # - 10
      # - 100