command:
  - ${env}
  - python
  - ${program}
  - ${args}
program: scripts/distill-layerwise.py
method: grid
metric:
  goal: minimize
  name: val_acc
parameters:
  output-dir:
    value: sweep-output/1-main-experiment
  dataset:
    values: 
      # - cifar100-large_man_made_outdoor_things-vs-others
      - cifar100-aquatic_mammals-vs-others
  training-size:
    values: 
      - 0.01
      # - 0.1
  seed:
    values:
      - 1
      - 2
      - 3
  teacher:
    value: cifar100-resnet18-v1
  student:
    values: 
      # - student-cifar-resnet18-16
      - student-cifar-resnet18-32
      # - student-cifar-resnet18-64
  layers:
    value: layer1:layer1,layer2:layer2,layer3:layer3,layer4:layer4
  weight-decay:
    value: 0
  lambda-layer:
    values: 
      - 0.001
      - 0.01
      - 0.1
      - 1.0
      - 10
      - 100
  distillation-policy:
    values:
      # - basis-bn:pca
      # - basis-bn:prcaposdef-entropy0.95
      # - vid
      # - attention-transfer
      # - spkd
      # - vkd
      - basis-bn-sum-normalized:pca
      - basis-bn-sum-normalized:prcaposdef-entropy0.95