command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --use-val-split
method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2024-02-s19/experiments/1-comparison-layers
parameters:
  contamination-level:
    value: 0.0
  dataset:
    value: cifar100-people
  lambda-task:
    value: 0
  lambda-kd:
    value: 1
  lambda-layer:
    values:
      - 0
      - 0.001
      - 0.01
      - 0.1
      - 1
      - 10
      - 100
      - 1000
      - 10000
      - 100000
      - 1000000
  training-size:
    value: 1.0
  seed:
    values:
      - 1
      - 2
      - 3
  layers:
    values:
      # - layer1,layer2,layer3,layer4
      # - layer2,layer3,layer4
      # - layer3,layer4
      - layer1
      - layer2
      - layer3
      # - layer4
  layer-policies:
    values:
      - basis-identity:pca--uncentered
      - basis-identity:prca-sortabs--uncentered
      - vid
  output-dir:
    value: *group_name
  student:
    value: resnet18xscifarcompr1
  teacher:
    value: cifar100-resnet18-v1
program: scripts/distill-layerwise.py
project: xaikd-distillation-layerwise-s19
