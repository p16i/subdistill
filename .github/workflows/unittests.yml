on: push
name: Unit Tests
jobs:
  Unittesting:
    name: unittesting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - run: curl -sSL https://install.python-poetry.org | python3 -
      - run: poetry install
      - run: TORCHVISION_DATASET_DOWNLOAD=1 poetry run pytest -m "not slow and not gpu" tests/*
