method: grid
metric:
  goal: minimize
  name: val_acc
name: &group_name ./artifacts/2023-10-s16/experiments/ex3.1-basis-attention-varying-ts-clv
parameters:
  contamination-level:
    values:
      - 0.0
      - 0.25
      - 0.5
      - 0.75
  dataset:
    value: cifar100-people
  lambda-kd:
    value: 1
  lambda-layer:
    # this is this best value from sweeping
    value: 1000
  lambda-task:
    value: 0
  seed:
    values:
      - 1
      - 2
      - 3
  layer-policies:
    values:
      - basis-attention:pca--uncentered
      - basis-attention:prca-sortabs--uncentered
      - basis-attention:random--uncentered
      - attention-transfer
  output-dir:
    value: *group_name
  student:
    value: resnet18xscifarcompr1id
  teacher:
    value: cifar100-resnet18-v1
  training-size:
    values:
      - 0.1
      - 0.25
      - 0.5
      - 1
program: scripts/distill-layerwise.py
project: xaikd-distillation-layerwise-ep2
